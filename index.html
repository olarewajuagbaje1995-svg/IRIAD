<style>

*{box-sizing:border-box}

/* FIXED: Using 100dvh (dynamic viewport height) and overflow hidden prevents the cutting issue */
html,body{margin:0;height:100vh;height:100dvh;overflow:hidden}
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--navy);color:#fff}
@media(prefers-color-scheme:dark){header{background:#06111d}}
header b{flex:1;font-size:.9rem;min-width:140px}
button,select,input,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px; transition: all 0.2s;}
button:hover{border-color:var(--teal)}button.p{background:var(--teal);color:#fff;border-color:var(--teal)}
header button{background:transparent;color:#fff;border-color:#ffffff55}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#prog{height:4px;background:var(--teal);width:0;transition:width .4s ease-out}

/* FIXED: Added padding-bottom to ensure the last item is never cut off */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 20px 60px 20px;max-width:1100px;width:100%;margin:0 auto}

/* Standard animation */
section{display:none;animation:in .35s ease-out forwards}
section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1{font-size:clamp(1.8rem,5vw,3rem);color:var(--navy);margin:.2em 0}h2{color:var(--navy);margin:.2em 0}
.sub{color:var(--mut)}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.tag{display:inline-block;font-size:.72rem;background:var(--acc);color:#fff;border-radius:99px;padding:1px 9px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow span{background:var(--navy);color:#fff;padding:4px 10px;border-radius:8px;font-size:.82rem}
@media(prefers-color-scheme:dark){.flow span{background:#1f4a75}}
.flow i{color:var(--teal);font-style:normal}
.demo{border:2px dashed var(--teal);border-radius:12px;padding:14px;margin:12px 0}
.bar{height:16px;background:var(--teal);border-radius:4px;transition:width .4s}
.st{border-left:4px solid var(--acc)}.ok{border-color:var(--teal)}
.note{font-size:.8rem;color:var(--mut)}
nav#dots{display:flex;gap:4px;flex-wrap:wrap;padding:6px 14px;justify-content:center;background:var(--card);border-top:1px solid var(--line)}
nav#dots button{padding:2px 8px;font-size:.78rem}nav#dots button.on{background:var(--teal);color:#fff}

/* PRESENTATION MODE & CINEMATIC TRANSITIONS */
body.pm header,body.pm nav#dots{display:none}
body.pm #exit{display:block}
#exit{display:none;position:fixed;top:8px;right:8px;z-index:9}
body.pm main{font-size:1.15rem; padding-top: 40px;}
body.pm section{animation:none} /* reset normal animation */
body.pm section.on{animation: cinematic .8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards}

@keyframes cinematic{
    0% { opacity: 0; transform: scale(0.96) translateY(40px); filter: blur(8px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
}

.hero{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:center}
input,select,textarea{padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
a{color:var(--teal)}

/* ===== AUTO-SLIDE TIMER ===== */
let autoSlideTimer = null;

function pres(on){
  document.body.classList.toggle('pm',on);
  if (on) {
    try { document.documentElement.requestFullscreen(); } catch (e) {}
    // Clear any existing timer first
    clearInterval(autoSlideTimer);
    // Automatically switch slide every 6 seconds
    autoSlideTimer = setInterval(() => {
        go((i + 1) % el.length);
    }, 6000);
  } else {
    try { document.fullscreenElement && document.exitFullscreen(); } catch(e) {}
    // Stop auto sliding
    clearInterval(autoSlideTimer);
  }
}

// Ensure timer stops if user uses ESC key to exit fullscreen
document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
        document.body.classList.remove('pm');
        clearInterval(autoSlideTimer);
    }
});

document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key=='ArrowRight')go(i+1);if(e.key=='ArrowLeft')go(i-1);if(e.key=='Escape')pres(false)});
